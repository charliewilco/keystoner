# Pass your globally unique app name with --app; no app is created by this file.
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  PORT = "8080"
  CATALOG_DIR = "/app/catalog"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
