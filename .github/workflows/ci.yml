name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test -z "$(gofmt -l cmd internal docs core cli tools)"
      - name: Check API dependency boundary
        run: |
          if go list -deps ./cmd/keystoner | grep -Eq 'keystoner/(cli|tools/scraper)|robotstxt|x/net/html'; then
            echo 'API must not depend on the scraper or CLI'
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -v
      - run: sh -n scripts/container.sh
      - name: Build native executables
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o keystoner ./cmd/keystoner
          go build -trimpath -ldflags="-s -w" -o work/discover ./cmd/discover
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o work/keystoner-linux-arm64 ./cmd/keystoner
